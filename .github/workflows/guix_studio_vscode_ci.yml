name: GUIX Studio VS Code (CLI + Extension)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  cli:
    name: Build + test guix_studio_cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tools/guix_studio_cli -B build/guix_studio_cli_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/guix_studio_cli_ci --config Release

      - name: Test (CTest)
        run: ctest --test-dir build/guix_studio_cli_ci --output-on-failure -C Release

      - name: Upload CLI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: guix_studio_cli-${{ runner.os }}-${{ runner.arch }}
          path: build/guix_studio_cli_ci/Release/guix_studio_cli.exe

      - name: Upload CLI artifact (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: guix_studio_cli-${{ runner.os }}-${{ runner.arch }}
          path: build/guix_studio_cli_ci/guix_studio_cli

  extension:
    name: Build + smoke vscode-guix-studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-guix-studio/package-lock.json

      - name: Install
        working-directory: vscode-guix-studio
        run: npm ci

      - name: Compile + smoke
        working-directory: vscode-guix-studio
        run: npm run -s smoke:gxp
