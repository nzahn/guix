name: GUIX Studio VS Code (CLI + Extension)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  cli:
    name: Build + test guix_studio_cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tools/guix_studio_cli -B build/guix_studio_cli_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/guix_studio_cli_ci --config Release

      - name: Test (CTest)
        run: ctest --test-dir build/guix_studio_cli_ci --output-on-failure -C Release

      - name: Upload CLI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: guix_studio_cli-${{ runner.os }}-${{ runner.arch }}
          path: build/guix_studio_cli_ci/Release/guix_studio_cli.exe

      - name: Upload CLI artifact (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: guix_studio_cli-${{ runner.os }}-${{ runner.arch }}
          path: build/guix_studio_cli_ci/guix_studio_cli

  extension:
    name: Build + smoke vscode-guix-studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-guix-studio/package-lock.json

      - name: Install
        working-directory: vscode-guix-studio
        run: npm ci

      - name: Compile + smoke
        working-directory: vscode-guix-studio
        run: npm run -s smoke:gxp

  vsix:
    name: Package VSIX (bundled CLI artifacts)
    runs-on: ubuntu-latest
    needs: [cli, extension]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-guix-studio/package-lock.json

      - name: Install
        working-directory: vscode-guix-studio
        run: npm ci

      - name: Compile
        working-directory: vscode-guix-studio
        run: npm run -s compile

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli_artifacts
          pattern: guix_studio_cli-*

      - name: Stage CLI binaries into extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vscode-guix-studio/bin

          shopt -s nullglob
          for d in cli_artifacts/guix_studio_cli-*; do
            base="$(basename "$d")"
            os="$(echo "$base" | cut -d- -f2)"
            arch="$(echo "$base" | cut -d- -f3 | tr '[:upper:]' '[:lower:]')"
            case "$os" in
              Windows) plat=win32 ;;
              Linux) plat=linux ;;
              macOS) plat=darwin ;;
              *) echo "Unknown OS in artifact name: $os"; exit 1 ;;
            esac

            dest="vscode-guix-studio/bin/${plat}-${arch}"
            mkdir -p "$dest"

            if [ "$plat" = "win32" ]; then
              cp "$d/guix_studio_cli.exe" "$dest/guix_studio_cli.exe"
            else
              cp "$d/guix_studio_cli" "$dest/guix_studio_cli"
              chmod +x "$dest/guix_studio_cli"
            fi
          done

          echo "Staged binaries:"
          find vscode-guix-studio/bin -maxdepth 3 -type f -print

      - name: Package VSIX
        working-directory: vscode-guix-studio
        run: npx --yes @vscode/vsce package -o ../guix-studio-preview.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: guix-studio-preview-vsix
          path: guix-studio-preview.vsix
